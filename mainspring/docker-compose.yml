version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mainspring_server_1
      APP_PORT: 8317
      # Tools on other machines call the API with a sk-ms- key, so these paths
      # skip Umbrel's login. Mainspring checks the key on every request.
      # The panel at / stays behind Umbrel's login.
      PROXY_AUTH_WHITELIST: "/v1,/v1/*,/v0/management/*,/health"

  server:
    image: ghcr.io/kacperkwapisz/mainspring:1.0.0-rc.12@sha256:463478e7626aa2836dbf49fe693b94aa155d71fe4a6c95d42f28d4b1e54a40b6
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 15s
    environment:
      # Umbrel's login already protects the panel. Security keys can be added
      # on top from Settings once the panel is opened over trusted HTTPS.
      MAINSPRING_AUTH: proxy
      # Update instructions in the panel point at the Umbrel App Store.
      MAINSPRING_INSTALL: umbrel
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
